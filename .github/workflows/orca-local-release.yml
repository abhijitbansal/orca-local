name: Orca Local release

# Builds a signed + notarized macOS release on every push to main and publishes it as a
# GitHub release (v<version>-local.<n>) with both DMGs, SHA256SUMS.txt and generated notes.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   MAC_CERTS            base64 of the "Developer ID Application" .p12
#   MAC_CERTS_PASSWORD   that .p12's password
#   ASC_KEY_ID           App Store Connect API key id
#   ASC_ISSUER_ID        App Store Connect issuer id
#   ASC_KEY_P8           contents of AuthKey_<ASC_KEY_ID>.p8
# Until all five exist the job skips the build with a notice instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Why no cancel: two quick merges must not race on the release tag counter.
concurrency:
  group: orca-local-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'abhijitbansal/orca-local'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          for name in MAC_CERTS MAC_CERTS_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Skipping the release build: missing secrets ${missing[*]}."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          # Why full history + tags: the tag counter, the skip check and the notes all read them.
          fetch-depth: 0
          fetch-tags: true

      - name: Skip a commit that already has a release
        id: existing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          tag="$(git tag --points-at HEAD --list 'v*-local.*' | head -n 1)"
          if [ -n "$tag" ]; then
            echo "::notice::$GITHUB_SHA is already released as $tag."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.existing.outputs.released == 'false'
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        if: steps.existing.outputs.released == 'false'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache electron-builder downloads
        if: steps.existing.outputs.released == 'false'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why both CPUs: the mac config packages x64 and arm64 from this arm64 runner.
      - name: Install dependencies
        if: steps.existing.outputs.released == 'false'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install:release

      - name: Import the Developer ID certificate
        if: steps.existing.outputs.released == 'false'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/orca-local-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Why xargs: it unquotes the paths list-keychains prints, without word-splitting them.
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          rm -f "$cert"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          # Fail fast: -v lists only identities with a valid chain.
          security find-identity -v -p codesigning | grep -q "Developer ID Application:" || {
            echo "::error::No valid Developer ID Application identity after import."
            exit 1
          }

      - name: Write the App Store Connect key
        if: steps.existing.outputs.released == 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          asc_dir="$RUNNER_TEMP/asc"
          mkdir -m 700 "$asc_dir"
          printf 'KEY_ID=%s\nISSUER_ID=%s\n' "$ASC_KEY_ID" "$ASC_ISSUER_ID" > "$asc_dir/config"
          printf '%s\n' "$ASC_KEY_P8" > "$asc_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$asc_dir/config" "$asc_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ORCA_ASC_DIR=$asc_dir" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: steps.existing.outputs.released == 'false'
        run: pnpm build:mac:release:local

      - name: Publish the GitHub release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(node config/scripts/orca-local-release.mjs next-tag)"
          node config/scripts/orca-local-release.mjs notes --tag "$tag" > "$RUNNER_TEMP/notes.md"
          node config/scripts/orca-local-release.mjs assets "$RUNNER_TEMP/assets"
          gh release create "$tag" "$RUNNER_TEMP"/assets/* \
            --target "$GITHUB_SHA" \
            --title "Orca Local $tag" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/developer-id.p12"
