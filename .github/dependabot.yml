version: 2
updates:
  # Why only ripgrep: the bundled rg ships in every artifact, and a bump is a one-line pin
  # change. Other dependencies stay manual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: '@vscode/ripgrep-universal'
    open-pull-requests-limit: 1
